<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #070708; }
      body { font-family: "Inter", system-ui, sans-serif; color: #f4f4f5; position: relative; }
      .glow { position: absolute; right: -60px; top: 40px; width: 640px; height: 640px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,43,61,0.22), transparent 62%); filter: blur(10px); }
      .scan { position: absolute; inset: 0; opacity: .5;
        background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); }
      .crystal { position: absolute; right: 90px; top: 90px; width: 450px; height: 450px; }
      .content { position: absolute; left: 80px; top: 120px; width: 620px; }
      .pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,43,61,0.4); background: rgba(255,43,61,0.08);
        color: #ff2b3d; font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 16px;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
      .pill i { width: 8px; height: 8px; background: #3ddc97; display: inline-block; box-shadow: 0 0 8px rgba(61,220,151,.9); }
      h1 { font-family: "Manrope", sans-serif; font-size: 84px; line-height: 1.02; letter-spacing: -0.03em; margin-top: 30px; font-weight: 800; }
      h1 span { display:block; font-size: 52px; color: #85858f; font-weight: 700; margin-top: 6px; }
      .caret { display:inline-block; width: 20px; height: 62px; background: #ff2b3d; vertical-align: -4px; margin-left: 10px;
        box-shadow: 0 0 20px rgba(255,43,61,.8); }
      .role { margin-top: 26px; font-size: 21px; color: #c5c5cb; max-width: 560px; line-height: 1.5; }
      .name { position: absolute; left: 80px; bottom: 56px; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; }
      .name .mark { width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.12); background: #0e0e11; display: grid; place-items: center;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
      .tags { position: absolute; right: 80px; bottom: 56px; display: flex; gap: 8px; }
      .tags span { font-family: "JetBrains Mono", monospace; font-size: 12px; color: #c5c5cb; border: 1px solid rgba(255,255,255,0.12);
        padding: 8px 12px; background: rgba(255,255,255,0.03); border-radius: 3px; }
      .hud { position: absolute; width: 22px; height: 22px; border: 2px solid rgba(255,43,61,.7); }
      .hud.tl { left: 40px; top: 40px; border-right: 0; border-bottom: 0; }
      .hud.br { right: 40px; bottom: 40px; border-left: 0; border-top: 0; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="scan"></div>
    <div class="hud tl"></div>
    <div class="hud br"></div>
    <div class="crystal">
      <svg viewBox="-110 -110 220 220" width="100%" height="100%">
        <defs>
          <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a2830"/><stop offset="100%" stop-color="#101013"/></linearGradient>
          <linearGradient id="f2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a1a22"/><stop offset="100%" stop-color="#120f12"/></linearGradient>
          <linearGradient id="f3" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#1a1a1f"/><stop offset="100%" stop-color="#0c0c0f"/></linearGradient>
        </defs>
        <ellipse cx="0" cy="12" rx="104" ry="34" fill="none" stroke="rgba(255,255,255,0.18)" />
        <circle cx="-104" cy="12" r="5" fill="#ffd8d3"/><circle cx="70" cy="38" r="4" fill="#ff2b3d"/><circle cx="98" cy="-6" r="6" fill="#fff"/>
        <polygon points="0,-96 72,-38 44,64 -44,64 -72,-38" fill="url(#f1)" stroke="rgba(255,43,61,0.4)"/>
        <polygon points="0,-96 72,-38 0,-6" fill="url(#f2)" stroke="rgba(255,43,61,0.4)"/>
        <polygon points="0,-96 -72,-38 0,-6" fill="url(#f3)" stroke="rgba(255,43,61,0.4)"/>
        <polygon points="72,-38 44,64 0,-6" fill="url(#f3)" stroke="rgba(255,43,61,0.4)"/>
        <polygon points="-72,-38 -44,64 0,-6" fill="url(#f2)" stroke="rgba(255,43,61,0.4)"/>
        <polygon points="44,64 -44,64 0,-6" fill="url(#f1)" stroke="rgba(255,43,61,0.4)"/>
        <circle cx="0" cy="-6" r="10" fill="#ff2b3d" opacity="0.95"/><circle cx="0" cy="-6" r="24" fill="#ff2b3d" opacity="0.2"/>
      </svg>
    </div>
    <div class="content">
      <div class="pill"><i></i> Open to software development roles</div>
      <h1>Abuzar Khan<span>Software Developer<span class="caret"></span></span></h1>
      <p class="role">Flutter · React · React Native · Firebase — production apps for government, healthcare and AI-powered products.</p>
    </div>
    <div class="name">
      <span class="mark"><svg viewBox="0 0 64 64" width="26" height="26"><path d="M32 12 14 50h9l3.4-8.5h11.2L41 50h9L32 12zm0 12.6 3.9 10H28.1l3.9-10z" fill="#ff2b3d"/></svg></span>
      abuzar7024 <span style="color:#85858f;font-weight:500">· portfolio 2026</span>
    </div>
    <div class="tags"><span>Digitopia</span><span>Ebani</span><span>Essonify</span><span>Tajneed</span></div>
  </body>
</html>
