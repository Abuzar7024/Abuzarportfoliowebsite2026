<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #050506; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        color: #f3f5f8;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse at 70% 50%, #000 20%, transparent 75%);
      }
      .glow { position: absolute; right: -80px; top: 60px; width: 620px; height: 620px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,45,63,0.22), transparent 60%); }
      .core { position: absolute; right: 120px; top: 115px; width: 400px; height: 400px; }
      .core svg { width: 100%; height: 100%; }
      .content { position: absolute; left: 80px; top: 92px; width: 640px; }
      .pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,45,63,0.35); background: rgba(255,45,63,0.08);
        color: #ff2d3f; font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 16px; border-radius: 999px; }
      .pill i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block; }
      h1 { font-family: "Manrope", sans-serif; font-size: 72px; line-height: 0.98; letter-spacing: -0.03em; margin-top: 36px; font-weight: 800; }
      h1 span { background: linear-gradient(90deg, #fff, #ffb3ba 50%, #ff2d3f); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .role { margin-top: 28px; font-size: 22px; color: #c3c9d3; font-weight: 500; }
      .name { position: absolute; left: 80px; bottom: 64px; display: flex; align-items: center; gap: 16px; font-size: 22px; font-weight: 600; }
      .name .mark { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: #0b0b0e; display: grid; place-items: center; }
      .name small { color: #8a93a3; font-weight: 500; font-size: 18px; }
      .tags { position: absolute; right: 80px; bottom: 64px; display: flex; gap: 8px; }
      .tags span { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.08em; color: #c3c9d3; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 8px 12px; background: rgba(255,255,255,0.03); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="core">
      <svg viewBox="-200 -200 400 400">
        <defs>
          <radialGradient id="g" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#ff2d3f" stop-opacity="0.75"/><stop offset="60%" stop-color="#141014"/><stop offset="100%" stop-color="#050506"/></radialGradient>
        </defs>
        <circle r="78" fill="url(#g)"/>
        <circle r="100" fill="none" stroke="#ff2d3f" stroke-opacity="0.3" stroke-dasharray="3 9"/>
        <g transform="scale(1 0.38) rotate(-18)"><ellipse rx="150" ry="150" fill="none" stroke="#fff" stroke-opacity="0.16"/><circle cx="150" r="6" fill="#fff"/><circle cx="-150" r="6" fill="#fff"/><circle cy="150" r="6" fill="#ff2d3f"/></g>
        <g transform="scale(1 0.55) rotate(30)"><ellipse rx="185" ry="185" fill="none" stroke="#fff" stroke-opacity="0.12"/><circle cx="185" r="6" fill="#ff8a6b"/><circle cx="-185" r="6" fill="#fff"/><circle cy="-185" r="6" fill="#fff"/></g>
        <g transform="scale(0.6 1) rotate(12)"><ellipse rx="195" ry="195" fill="none" stroke="#fff" stroke-opacity="0.1"/><circle cy="195" r="6" fill="#ff2d3f"/><circle cy="-195" r="6" fill="#fff"/></g>
      </svg>
    </div>
    <div class="content">
      <div class="pill"><i></i> Open to software development roles</div>
      <h1>Building digital<br />products that<br /><span>actually ship.</span></h1>
      <p class="role">Software Developer • Mobile &amp; Web • Product Builder</p>
    </div>
    <div class="name">
      <span class="mark"><svg viewBox="0 0 64 64" width="26" height="26"><path d="M32 12 14 50h9l3.4-8.5h11.2L41 50h9L32 12zm0 12.6 3.9 10H28.1l3.9-10z" fill="#ff2d3f"/></svg></span>
      Abuzar Khan <small>· Flutter · React · Firebase</small>
    </div>
    <div class="tags"><span>Digitopia</span><span>Ebani</span><span>Tajneed</span><span>Sadeeq</span><span>Riayah</span></div>
  </body>
</html>
